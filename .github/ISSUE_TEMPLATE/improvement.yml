name: 🔧 Improvement
description: Suggest an improvement to existing functionality
title: "[Improvement]: "
labels: [improvement]
body:
  - type: textarea
    id: what
    attributes:
      label: What should be improved?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
    validations:
      required: false